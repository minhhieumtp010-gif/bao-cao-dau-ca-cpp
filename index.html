<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo cáo đầu ca CPP</title><style>body{font-family:system-ui,Arial;margin:0;background:#f1f5f9;color:#172033}main{max-width:760px;margin:auto;padding:16px}h1{font-size:22px}section{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0001}h2{font-size:17px;margin-top:0;color:#155e75}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px;font:inherit;background:white}textarea{min-height:105px}button{border:0;border-radius:9px;padding:12px 16px;background:#0369a1;color:white;font-weight:700;margin:5px 5px 5px 0;cursor:pointer}button.secondary{background:#475569}button.danger{background:#b91c1c}small{color:#64748b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;border:1px solid #cbd5e1;padding:12px;border-radius:8px;font:14px/1.65 system-ui}details{margin:10px 0}summary{cursor:pointer;font-weight:650} .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:450px){.row{grid-template-columns:1fr}}.status{color:#047857;font-size:13px}fieldset.unit{border:1px solid #cbd5e1;border-radius:10px;margin:14px 0;padding:12px;min-width:0}fieldset.unit legend{font-weight:800;color:#0f766e;padding:0 6px}.check{display:flex;align-items:center;gap:9px;font-weight:500;margin:10px 0}.check input{width:20px;height:20px;flex:none}.pump-title{font-size:13px;color:#475569;margin-top:12px}.pump-list{display:flex;gap:16px;flex-wrap:wrap}.unit-fields[hidden]{display:none}</style></head><body><main><h1>📋 Báo cáo đầu ca CPP</h1><section><h2>1. Chọn ngày và ca</h2><div class="row"><div><label for="date">Ngày báo cáo</label><input id="date" type="date"></div><div><label for="shift">Ca nhập</label><select id="shift"><option value="KHUYA">Ca khuya</option><option value="SÁNG">Ca sáng</option><option value="CHIỀU">Ca chiều</option></select></div></div><small>Mỗi ngày và ca có dữ liệu riêng. Thông số tự lưu khi nhập.</small></section><div id="form"></div><section><h2>3. Chốt báo cáo</h2><button id="finalize">Chốt và lưu lịch sử</button><button id="copy" class="secondary">Sao chép báo cáo</button><div id="status" class="status" aria-live="polite"></div><pre id="output"></pre></section><section><h2>4. Lịch sử đã chốt</h2><div id="history"></div><button id="export" class="secondary">Xuất sao lưu JSON</button><label for="import">Nhập file sao lưu JSON</label><input type="file" id="import" accept="application/json,.json"></section></main><script>
const issues=["Rò nước đường tuần hoàn CPU-1A","Rò nước đường tuần hoàn CPU- 1B","Rò nước đường tuần hoàn CPU- 1C","Rò nước đường tuần hoàn CPU-2C","Rò nước van đầu ra CPU-1B","Rò nước van tay đường thông rửa tranmister đo chênh áp CPP S1","Rò nước ở mặt bích đầu ra và van đầu hút bơm tuần hoàn hệ thống CPP S1","Rò nước chèn ở van khí nén đường rửa ngược Pre-Filter A hệ thống CPP S1","Hệ thống CPP S1 chưa có sàn thao tác","Rò nước đầu vào, đầu ra CPU-2A","Rò nước ở van Selenoi điền nước Pre- Filter 2A","Van FCV bypass hệ thống  CPP S2  bị lỗi logic ( tự động nhảy Manual về Auto khi điền nước CPU thứ 2 )","Ejector hệ thống hoàn nguyên hạt nhựa có tình trạng bị rò nước, nhà thầu đã tiến hành kiểm tra, chưa khắc phục.","Bơm hồ trung hoà A, C có tình trạng bì rò nước ở phớt chèn cơ khí khi vận hành ( Nhà thầu chưa khắc phục)","Nhiều van tay và van khí nén ở hệ thống hoàn nguyên hạt bị rỉ sét, ăn mòn.","Bơm nhập và chuyển HCl hoàn nguyên bị kẹt, nhà thầu đang tháo ra chưa có công tác mới","Lưu lượng nước ngưng đầu vào CPP trên HMI đang hiển thị sai"];
const groups=[{title:'Nhân sự',items:[['staff','HV CPP','Lê Minh Hiếu']]},{title:'a) Hệ thống XLN ngưng',items:[['s1pre','S1 · Prefilter'],['s1pref','S1 · Lưu lượng Prefilter (m3/h)'],['s1cpu1','S1 · CPU thứ nhất'],['s1flow1','S1 · Lưu lượng CPU thứ nhất (m3/h)'],['s1cpu2','S1 · CPU thứ hai'],['s1flow2','S1 · Lưu lượng CPU thứ hai (m3/h)'],['s2pre','S2 · Prefilter'],['s2pref','S2 · Lưu lượng Prefilter (m3/h)'],['s2cpu1','S2 · CPU thứ nhất'],['s2flow1','S2 · Lưu lượng CPU thứ nhất (m3/h)'],['s2cpu2','S2 · CPU thứ hai'],['s2flow2','S2 · Lưu lượng CPU thứ hai (m3/h)']]},{title:'b) Hệ thống hoàn nguyên',items:[['regen','Đang ...']]},{title:'c) Hệ thống dosing',items:[['s1nh','S1 · Mức bồn NH40H (cm)'],['s1hm','S1 · Mức bồn HMV1040 (cm)'],['s2nh','S2 · Mức bồn NH40H (cm)'],['s2hm','S2 · Mức bồn HMV1040 (cm)']]}];
const $=id=>document.getElementById(id), storeKey='cpp_report_v1';let db={};try{db=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{};db.drafts ||= {};db.history ||= {};const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');const key=()=>`${$('date').value}|${$('shift').value}`;const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(db));$('status').textContent='✓ Đã tự động lưu'}catch(e){$('status').textContent='Không thể lưu: bộ nhớ trình duyệt bị hạn chế hoặc đầy.'}};const val=id=>(db.drafts[key()]||{})[id]??'';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const d=db.drafts[key()]||{};let html='';for(const g of groups){html+=`<section><h2>${esc(g.title)}</h2>`;if(g.title.includes('XLN ngưng')||g.title.includes('dosing')){const isWater=g.title.includes('XLN ngưng');for(const unit of ['s1','s2']){html+=`<fieldset class="unit"><legend>${unit.toUpperCase()}</legend>`;if(isWater){html+=`<label class="check"><input type="checkbox" data-stop="${unit}" ${d[unit+'stop']?'checked':''}> Hệ thống đang dừng, FCV Bypass mở 100%</label><div class="unit-fields" data-unit="${unit}" ${d[unit+'stop']?'hidden':''}>`;}if(isWater){const n=unit==='s1'?'1':'2';html+='<div class="pump-title">Chọn Prefilter đang vận hành:</div><div class="pump-list">';for(const suffix of ['A','B']){const pf=n+suffix;const old=String(d[unit+'pre']||'').trim().toUpperCase();const checked=d['prefilter_'+pf]===true||(d['prefilter_'+pf]===undefined&&old===pf);html+=`<label class="check"><input type="checkbox" data-prefilter="${pf}" ${checked?'checked':''}> Prefilter-${pf}</label>`;}html+='</div>';for(const suffix of ['A','B']){const pf=n+suffix;const old=String(d[unit+'pre']||'').trim().toUpperCase();const checked=d['prefilter_'+pf]===true||(d['prefilter_'+pf]===undefined&&old===pf);const flow=d['preflow_'+pf]??(old===pf?d[unit+'pref']??'':'');html+=`<div data-pref-flow="${pf}" ${checked?'':'hidden'}><label for="flow_${pf}">Lưu lượng Prefilter-${pf} (m3/h)</label><input id="flow_${pf}" data-preflow="${pf}" value="${esc(flow)}" placeholder="Nhập lưu lượng..."></div>`;}}if(isWater){const n=unit==='s1'?'1':'2';for(const slot of [1,2]){const id=unit+'cpu'+slot;const other=d[unit+'cpu1']||'';html+=`<label for="f_${id}">CPU thứ ${slot===1?'nhất':'hai'}</label><select id="f_${id}" data-cpu="${id}" data-cpu-unit="${unit}" data-cpu-slot="${slot}"><option value="">-- Chọn CPU --</option>`;for(const suffix of ['A','B','C']){const cpu=n+suffix;if(slot===2&&cpu===other)continue;html+=`<option value="${cpu}" ${d[id]===cpu?'selected':''}>CPU-${cpu}</option>`;}html+='</select>';const fid=unit+'flow'+slot;html+=`<label for="f_${fid}">Lưu lượng CPU thứ ${slot===1?'nhất':'hai'} (m3/h)</label><input id="f_${fid}" data-field="${fid}" value="${esc(d[fid]??'')}" placeholder="Nhập lưu lượng...">`;}}for(const [id,label,defaultValue] of g.items.filter(item=>item[0].startsWith(unit))){if(isWater)continue;html+=`<label for="f_${id}">${esc(label.replace(/^S[12] · /,''))}</label><input id="f_${id}" data-field="${id}" value="${esc(d[id]??defaultValue??'')}" placeholder="Nhập thông số...">`;if(!isWater){const pumps=id.endsWith('nh')?['ADP-'+(unit==='s1'?'1':'2')+'A','ADP-'+(unit==='s1'?'1':'2')+'B']:['OSDP-'+(unit==='s1'?'1':'2')+'A','OSDP-'+(unit==='s1'?'1':'2')+'B'];html+='<div class="pump-title">Bơm đang vận hành (không chọn sẽ không hiển thị):</div><div class="pump-list">';for(const pump of pumps)html+=`<label class="check"><input type="checkbox" data-pump="${pump}" ${d['pump_'+pump]?'checked':''}> ${pump}</label>`;html+='</div>';}}if(isWater)html+='</div>';html+='</fieldset>';}}else{for(const [id,label,defaultValue] of g.items){html+=`<label for="f_${id}">${esc(label)}</label><input id="f_${id}" data-field="${id}" value="${esc(d[id]??defaultValue??'')}" placeholder="Nhập thông số...">`;}}html+='</section>';}html+='<section><h2>3. Bất thường, khiếm khuyết, lưu ý</h2><small>Bỏ chọn các mục không còn áp dụng; có thể bổ sung ghi chú mới.</small>';issues.forEach((issue,i)=>{const checked=d['issue_'+i]!==false;html+=`<label style="font-weight:400;display:flex;gap:9px;align-items:flex-start"><input type="checkbox" data-issue="${i}" ${checked?'checked':''} style="width:20px;flex:none;margin-top:3px"><span>${esc(issue)}</span></label>`});html+='<label for="extra">Ghi chú bổ sung (mỗi dòng một ý)</label><textarea id="extra" placeholder="Nhập ghi chú bổ sung...">'+esc(d.extra||'')+'</textarea></section>';$('form').innerHTML=html;$('form').querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{db.drafts[key()] ||= {};db.drafts[key()][el.dataset.field]=el.value;save();updateOutput()}));$('form').querySelectorAll('[data-cpu]').forEach(el=>el.addEventListener('change',()=>{db.drafts[key()] ||= {};const draft=db.drafts[key()];draft[el.dataset.cpu]=el.value;if(el.dataset.cpuSlot==='1'){const second=el.dataset.cpuUnit+'cpu2';if(draft[second]===el.value&&el.value)draft[second]='';const sel=$('f_'+second);if(sel){const previous=draft[second]||'';sel.innerHTML='<option value="">-- Chọn CPU --</option>';for(const suffix of ['A','B','C']){const cpu=(el.dataset.cpuUnit==='s1'?'1':'2')+suffix;if(cpu===el.value)continue;const opt=document.createElement('option');opt.value=cpu;opt.textContent='CPU-'+cpu;sel.appendChild(opt);}sel.value=previous;}}save();updateOutput()}));$('form').querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('change',()=>{db.drafts[key()] ||= {};db.drafts[key()][el.dataset.stop+'stop']=el.checked;const area=$('form').querySelector('[data-unit="'+el.dataset.stop+'"]');if(area)area.hidden=el.checked;save();updateOutput()}));$('form').querySelectorAll('[data-prefilter]').forEach(el=>el.addEventListener('change',()=>{db.drafts[key()] ||= {};db.drafts[key()]['prefilter_'+el.dataset.prefilter]=el.checked;const area=$('form').querySelector('[data-pref-flow="'+el.dataset.prefilter+'"]');if(area)area.hidden=!el.checked;save();updateOutput()}));$('form').querySelectorAll('[data-preflow]').forEach(el=>el.addEventListener('input',()=>{db.drafts[key()] ||= {};db.drafts[key()]['preflow_'+el.dataset.preflow]=el.value;save();updateOutput()}));$('form').querySelectorAll('[data-pump]').forEach(el=>el.addEventListener('change',()=>{db.drafts[key()] ||= {};db.drafts[key()]['pump_'+el.dataset.pump]=el.checked;save();updateOutput()}));$('form').querySelectorAll('[data-issue]').forEach(el=>el.addEventListener('change',()=>{db.drafts[key()] ||= {};db.drafts[key()]['issue_'+el.dataset.issue]=el.checked;save();updateOutput()}));$('extra').addEventListener('input',e=>{db.drafts[key()] ||= {};db.drafts[key()].extra=e.target.value;save();updateOutput()});updateOutput();renderHistory()}
function getValues(){const o={};for(const g of groups)for(const [id,,def] of g.items)o[id]=val(id)||((db.drafts[key()]||{})[id]===undefined?def||'':'');return o}function report(){const v=getValues(),draft=db.drafts[key()]||{},t=x=>String(x??'').trim()||'...';const [y,m,d]=$('date').value.split('-');const water=(unit)=>{if(draft[unit+'stop'])return `- ${unit.toUpperCase()}: Hệ thống đang dừng, FCV Bypass mở 100%`;const n=unit==='s1'?'1':'2';const pre=[];for(const suffix of ['A','B']){const pf=n+suffix;const old=String(draft[unit+'pre']||'').trim().toUpperCase();const selected=draft['prefilter_'+pf]===true||(draft['prefilter_'+pf]===undefined&&old===pf);if(selected){const flow=draft['preflow_'+pf]??(old===pf?draft[unit+'pref']:'');pre.push(`Prefilter-${pf}, F = ${t(flow)} m3/h`);}}const cpus=[`CPU-${t(v[unit+'cpu1'])}, F = ${t(v[unit+'flow1'])} m3/h`,`CPU-${t(v[unit+'cpu2'])}, F = ${t(v[unit+'flow2'])} m3/h`];return `- ${unit.toUpperCase()}: ${[...pre,...cpus].join('; ')}`};const dosing=(unit)=>{const n=unit==='s1'?'1':'2';const pumpText=(prefix)=>[prefix+'-'+n+'A',prefix+'-'+n+'B'].filter(p=>draft['pump_'+p]).join(', ');return [`- ${unit.toUpperCase()}`,`+ mức bồn NH40H${unit==='s1'?':':' ='} ${t(v[unit+'nh'])} cm${pumpText('ADP')?'; Bơm: '+pumpText('ADP'):''}`,`+ mức bồn HMV1040${unit==='s1'?':':' ='} ${t(v[unit+'hm'])} cm${pumpText('OSDP')?'; Bơm: '+pumpText('OSDP'):''}`]};let lines=[`BÁO CÁO TÌNH HÌNH THIẾT BỊ ĐẦU CA HỆ THỐNG CPP CA ${$('shift').value} ${d}/${m}/${y}`,'1.Nhân sự',`- HV CPP: ${t(v.staff)}`,'2.Nhận ca','a) Hệ thống XLN ngưng',water('s1'),water('s2'),`b) Hệ thống hoàn nguyên: Đang ${t(v.regen)}`,'c) Hệ thống dosing:',...dosing('s1'),...dosing('s2'),'3. Bất thường, khiếm khuyết, lưu ý:'];issues.forEach((s,i)=>{if(draft['issue_'+i]!==false)lines.push('- '+s)});(draft.extra||'').split('\n').filter(x=>x.trim()).forEach(x=>lines.push('- '+x.trim().replace(/^-\s*/,'')));return lines.join('\n')};function updateOutput(){$('output').textContent=report()};$('date').addEventListener('change',render);$('shift').addEventListener('change',render);$('finalize').addEventListener('click',()=>{const values=getValues(),draft=db.drafts[key()]||{};const missing=Object.entries(values).filter(([id,v])=>!['s1pre','s1pref','s2pre','s2pref'].includes(id)&&!(draft.s1stop&&id.startsWith('s1')&&!['s1nh','s1hm'].includes(id))&&!(draft.s2stop&&id.startsWith('s2')&&!['s2nh','s2hm'].includes(id))&&!String(v).trim()).length + ['1A','1B','2A','2B'].filter(p=>{const u=p[0]==='1'?'s1':'s2';if(draft[u+'stop'])return false;const old=String(draft[u+'pre']||'').trim().toUpperCase();const selected=draft['prefilter_'+p]===true||(draft['prefilter_'+p]===undefined&&old===p);return selected&&!String(draft['preflow_'+p]??(old===p?draft[u+'pref']:'')).trim()}).length;if(missing&&!confirm(`Còn ${missing} thông số trống. Vẫn chốt báo cáo?`))return;db.history[key()]={text:report(),time:new Date().toISOString()};save();renderHistory();$('status').textContent='✓ Đã chốt và lưu lịch sử'});$('copy').addEventListener('click',async()=>{const txt=$('output').textContent;try{await navigator.clipboard.writeText(txt);$('status').textContent='✓ Đã sao chép'}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();$('status').textContent=ok?'✓ Đã sao chép':'Hãy nhấn giữ vào nội dung báo cáo để sao chép.'}});function renderHistory(){const keys=Object.keys(db.history).sort().reverse();$('history').innerHTML=keys.length?'':'<small>Chưa có báo cáo đã chốt.</small>';for(const k of keys){const [date,shift]=k.split('|');const div=document.createElement('details');const sum=document.createElement('summary');sum.textContent=`${date.split('-').reverse().join('/')} · Ca ${shift}`;div.appendChild(sum);const pre=document.createElement('pre');pre.textContent=db.history[k].text;div.appendChild(pre);const load=document.createElement('button');load.textContent='Mở ngày/ca này';load.addEventListener('click',()=>{$('date').value=date;$('shift').value=shift;render();scrollTo({top:0,behavior:'smooth'})});div.appendChild(load);const del=document.createElement('button');del.className='danger';del.textContent='Xóa bản chốt';del.addEventListener('click',()=>{if(confirm('Xóa bản báo cáo đã chốt này? Dữ liệu đang nhập vẫn được giữ.')){delete db.history[k];save();renderHistory()}});div.appendChild(del);$('history').appendChild(div)}}$('export').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='cpp-sao-luu-'+$('date').value+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('import').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!parsed||typeof parsed.drafts!=='object'||typeof parsed.history!=='object')throw Error('Định dạng không hợp lệ');if(confirm('Nhập bản sao lưu sẽ thay thế toàn bộ dữ liệu hiện có. Tiếp tục?')){db=parsed;save();render()}}catch(err){alert('Không đọc được file sao lưu: '+err.message)}e.target.value=''});render();
</script></body></html>
